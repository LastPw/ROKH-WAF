[package]
name = "rokh_waf"
version = "1.0.0"
edition = "2021"
authors = ["Taha Vaziri"]
description = "ROKH WAF (دیواره آتش رُخ) - High-Performance Reverse Proxy, OWASP DFA Inspection Engine & Anti-DDoS Defense System"
license = "MIT"
readme = "README.md"
keywords = ["waf", "security", "reverse-proxy", "owasp", "anti-ddos"]
categories = ["network-programming", "web-programming::http-server"]

default-run = "waf_engine"

[[bin]]
name = "waf_engine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
sha2 = "0.10"
hex = "0.4"
