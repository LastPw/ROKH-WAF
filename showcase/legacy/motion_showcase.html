<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisGate / Rokh WAF - Cinematic Motion Graphics Showcase</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #030712;
            --neon-cyan: #00f3ff;
            --neon-blue: #3b82f6;
            --neon-violet: #8b5cf6;
            --neon-red: #ff0055;
            --neon-amber: #f59e0b;
            --neon-emerald: #10b981;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(56, 189, 248, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-void);
            color: #f8fafc;
            font-family: 'Vazirmatn', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* Fullscreen Motion Canvas */
        #motionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Cyberpunk UI Overlays */
        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
        }

        /* Top HUD Bar */
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .brand-badge-container {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15);
        }

        .brand-logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
            animation: logoPulse 3s ease-in-out infinite alternate;
        }

        @keyframes logoPulse {
            0% { transform: scale(0.98); box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 28px rgba(6, 182, 212, 0.8); }
        }

        .brand-text h1 {
            font-family: 'Orbitron', 'Vazirmatn', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--neon-cyan), #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-text p {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Brand Selector Dropdown */
        .brand-selector {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', 'Vazirmatn', monospace;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
        }

        .brand-selector:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        /* Top-Right Telemetry & Sound Controls */
        .telemetry-deck {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .stat-pill {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 10px 18px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-pill-label {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .stat-pill-val {
            font-size: 16px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .btn-hud {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #f1f5f9;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            backdrop-filter: blur(12px);
        }

        .btn-hud:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Center Holographic Title & Watermark */
        .center-hud-brand {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 5;
        }

        .center-hud-brand h2 {
            font-family: 'Orbitron', 'Vazirmatn', sans-serif;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.08);
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
            transition: all 0.4s ease;
        }

        .center-hud-brand span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            letter-spacing: 4px;
            color: rgba(6, 182, 212, 0.5);
            display: block;
            margin-top: -6px;
        }

        /* Bottom Interactive Command Dock */
        .hud-bottom {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            pointer-events: auto;
        }

        /* Attack Vector Launcher Panel */
        .command-dock {
            display: flex;
            gap: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 12px 20px;
            border-radius: 20px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .btn-action {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-action::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .btn-action:hover::before {
            left: 100%;
        }

        .btn-action:hover {
            transform: translateY(-3px);
        }

        .btn-action.red:hover {
            border-color: var(--neon-red);
            color: #fda4af;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }

        .btn-action.amber:hover {
            border-color: var(--neon-amber);
            color: #fde68a;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
        }

        .btn-action.cyan:hover {
            border-color: var(--neon-cyan);
            color: #a5f3fc;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
        }

        .btn-action.green:hover {
            border-color: var(--neon-emerald);
            color: #a7f3d0;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        /* Live Cyber Threat Ticker */
        .threat-ticker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(10, 14, 23, 0.8);
            padding: 6px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .threat-ticker-pulse {
            width: 8px;
            height: 8px;
            background: var(--neon-emerald);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-emerald);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Sound Alert Floating Message */
        .toast-combat {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            pointer-events: none;
            z-index: 20;
            animation: floatUpFade 1.2s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
            text-shadow: 0 0 15px currentColor;
            direction: ltr;
        }

        @keyframes floatUpFade {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.1); }
            80% { opacity: 0.9; transform: translate(-50%, -50px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(0.9); }
        }
    </style>
</head>
<body>

    <!-- Holographic 60FPS Canvas -->
    <canvas id="motionCanvas"></canvas>

    <!-- Cyber HUD Overlays -->
    <div class="hud-overlay">
        <!-- Top Navigation & Brand Controls -->
        <div class="hud-top">
            <div class="brand-badge-container">
                <div class="brand-logo-icon" id="logoIcon">🛡️</div>
                <div class="brand-text">
                    <h1 id="brandNameDisplay">AEGISGATE WAF</h1>
                    <p id="brandSubDisplay">RUST DPI + AI NEURAL THREAT CORE</p>
                </div>
                <select class="brand-selector" id="brandSelector" onchange="changeBrand(this.value)">
                    <option value="aegis">⚡ AegisGate (ایجس‌گیت - سپر خدایان)</option>
                    <option value="rokh" selected>🏰 Rokh WAF (رخ - دژ نفوذناپذیر)</option>
                    <option value="sentry">👁️ SentryX (سنتینل - نگهبان هوشمند)</option>
                    <option value="kestrel">🦅 Kestrel Core (کسترل - شکارچی پرسرعت)</option>
                    <option value="ironclad">⚔️ IronClad (آیرونکلد - زره فولادی)</option>
                </select>
            </div>

            <div class="telemetry-deck">
                <div class="stat-pill">
                    <div class="stat-pill-label">دقت مهار حملات</div>
                    <div class="stat-pill-val" id="statAccuracy">93.9% [A+]</div>
                </div>
                <div class="stat-pill">
                    <div class="stat-pill-label">تاخیر بازرسی پکت</div>
                    <div class="stat-pill-val" id="statLatency">0.12 ms</div>
                </div>
                <div class="stat-pill">
                    <div class="stat-pill-label">پکت‌های مهارشده</div>
                    <div class="stat-pill-val" id="statBlockedCount">458</div>
                </div>
                <button class="btn-hud" id="btnAudioToggle" onclick="toggleAudio()">
                    <span id="audioIcon">🔊</span> صدا: فعال
                </button>
                <a href="http://127.0.0.1:9000/" target="_blank" style="text-decoration:none;">
                    <button class="btn-hud">
                        <span>📊</span> داشبورد SOC
                    </button>
                </a>
            </div>
        </div>

        <!-- Center Watermark Hologram -->
        <div class="center-hud-brand">
            <h2 id="centerWatermark">ROKH WAF</h2>
            <span>SECURE PROXY GATEWAY :: 127.0.0.1:8080</span>
        </div>

        <!-- Bottom Interactive Control Deck -->
        <div class="hud-bottom">
            <div class="command-dock">
                <button class="btn-action red" onclick="triggerAttackWave('SQLI')">
                    <span>💉</span> شلیک حمله SQLi
                </button>
                <button class="btn-action red" onclick="triggerAttackWave('XSS')">
                    <span>⚡</span> شلیک حمله XSS
                </button>
                <button class="btn-action red" onclick="triggerAttackWave('RCE')">
                    <span>💣</span> تزریق دستور شل (RCE)
                </button>
                <button class="btn-action amber" onclick="triggerDdosFlood()">
                    <span>🌊</span> رگبار سیلابی DDoS (۴۰ پکت)
                </button>
                <button class="btn-action green" onclick="triggerCleanTraffic()">
                    <span>🟢</span> تزریق ترافیک پاک کاربر
                </button>
                <button class="btn-action cyan" onclick="toggleOverdrive()">
                    <span>🛡️</span> حالت سپر کوانتومی (Overdrive)
                </button>
            </div>

            <div class="threat-ticker">
                <div class="threat-ticker-pulse"></div>
                <span>حالت پیشگیری فعال (Prevention Active)</span>
                <span>|</span>
                <span id="tickerLog">موتور آماده دریافت پکت‌ها: منتظر ترافیک زنده...</span>
            </div>
        </div>
    </div>

    <!-- Web Audio API + Motion Graphics Engine Script -->
    <script>
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d');

        // Brand Profile Presets
        const BRANDS = {
            rokh: {
                name: "ROKH WAF (رخ)",
                sub: "SOVEREIGN PERSIAN CYBER FORTRESS",
                watermark: "ROKH DEFENSE",
                logo: "🏰",
                primary: "#00f3ff",
                accent: "#8b5cf6"
            },
            aegis: {
                name: "AEGISGATE WAF",
                sub: "RUST DPI + AI NEURAL THREAT CORE",
                watermark: "AEGISGATE",
                logo: "🛡️",
                primary: "#38bdf8",
                accent: "#3b82f6"
            },
            sentry: {
                name: "SENTRY-X CORE",
                sub: "AUTONOMOUS ZERO-DAY INTERCEPTOR",
                watermark: "SENTRY-X",
                logo: "👁️",
                primary: "#10b981",
                accent: "#06b6d4"
            },
            kestrel: {
                name: "KESTREL SHIELD",
                sub: "SUB-MILLISECOND RAPID DEFENSE",
                watermark: "KESTREL",
                logo: "🦅",
                primary: "#f59e0b",
                accent: "#ef4444"
            },
            ironclad: {
                name: "IRONCLAD WAF",
                sub: "IMPERVIOUS LOW-LEVEL GATEWAY",
                watermark: "IRONCLAD",
                logo: "⚔️",
                primary: "#e2e8f0",
                accent: "#64748b"
            }
        };

        let currentBrand = 'rokh';

        function changeBrand(key) {
            currentBrand = key;
            const b = BRANDS[key];
            document.getElementById('brandNameDisplay').innerText = b.name;
            document.getElementById('brandSubDisplay').innerText = b.sub;
            document.getElementById('centerWatermark').innerText = b.watermark;
            document.getElementById('logoIcon').innerText = b.logo;
            playSound('switch');
        }

        // Window Resize Handling
        let width, height, centerX, centerY;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // -------------------------------------------------------------
        // SYNTHESIZED WEB AUDIO API SOUND SYSTEM
        // -------------------------------------------------------------
        let audioCtx = null;
        let audioEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('btnAudioToggle');
            const icon = document.getElementById('audioIcon');
            if (audioEnabled) {
                icon.innerText = "🔊";
                btn.innerHTML = `<span id="audioIcon">🔊</span> صدا: فعال`;
                initAudio();
                playSound('shield');
            } else {
                icon.innerText = "🔇";
                btn.innerHTML = `<span id="audioIcon">🔇</span> صدا: بی‌صدا`;
            }
        }

        function playSound(type) {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const t = audioCtx.currentTime;

            if (type === 'laser') {
                // High pitch laser zap
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.15);
                gain.gain.setValueAtTime(0.08, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.15);
            } else if (type === 'block') {
                // Deflection shockwave sound
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, t);
                osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.25);
            } else if (type === 'pass') {
                // Gentle chime for clean packet
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, t); // D5
                osc.frequency.setValueAtTime(880, t + 0.08); // A5
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.2);
            } else if (type === 'shield' || type === 'switch') {
                // Sci-fi power surge
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.exponentialRampToValueAtTime(900, t + 0.3);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.3);
            }
        }

        // -------------------------------------------------------------
        // MOTION GRAPHICS PARTICLES & PHYSICS ENGINE
        // -------------------------------------------------------------
        const packets = [];
        const sparks = [];
        const rings = [];

        let shieldRadius = 130;
        let targetShieldRadius = 130;
        let shieldPulse = 0;
        let shieldRotation = 0;
        let isOverdrive = false;
        let blockedCount = 458;

        class Packet {
            constructor(type, label, startAngle, speed, isAttack) {
                this.type = type;
                this.label = label;
                this.isAttack = isAttack;
                this.distance = Math.max(width, height) * 0.65;
                this.angle = startAngle;
                this.speed = speed;
                this.size = isAttack ? 6 : 4.5;
                this.color = isAttack ? '#ff0055' : '#00f3ff';
                this.glow = isAttack ? '#ff0055' : '#00f3ff';
                this.tail = [];
            }

            update() {
                this.distance -= this.speed;
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;

                this.tail.push({ x, y, alpha: 1 });
                if (this.tail.length > 12) this.tail.shift();
                this.tail.forEach(t => t.alpha *= 0.85);

                // Collision with WAF Shield Perimeter
                if (this.distance <= shieldRadius) {
                    if (this.isAttack) {
                        // Impact & Deflection Explosion
                        createSparkBurst(x, y, this.color);
                        createRing(x, y, this.color);
                        playSound('block');
                        showCombatToast(x, y, `[403 BLOCKED] ${this.label}`, '#ff0055');
                        blockedCount++;
                        document.getElementById('statBlockedCount').innerText = blockedCount;
                        document.getElementById('tickerLog').innerText = `[DEFENSE] هجوم ${this.label} توسط رول Rust دفع شد.`;
                    } else {
                        // Allowed Clean Passage into backend core
                        playSound('pass');
                        showCombatToast(x, y, `[200 OK] Clean Request`, '#10b981');
                        document.getElementById('tickerLog').innerText = `[ORIGIN] ترافیک کاربر سالم به سرور پایتون هدایت شد.`;
                    }
                    return false; // Remove packet
                }
                return true;
            }

            draw() {
                // Draw trailing energy tail
                for (let i = 0; i < this.tail.length - 1; i++) {
                    const p1 = this.tail[i];
                    const p2 = this.tail[i + 1];
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = (i / this.tail.length) * this.size;
                    ctx.globalAlpha = p1.alpha * 0.6;
                    ctx.stroke();
                }

                // Draw packet head
                const x = centerX + Math.cos(this.angle) * this.distance;
                const y = centerY + Math.sin(this.angle) * this.distance;

                ctx.save();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 18;
                ctx.shadowColor = this.glow;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Draw label tag
                ctx.font = '10px JetBrains Mono';
                ctx.fillStyle = this.color;
                ctx.fillText(this.label, x + 10, y + 3);
                ctx.restore();
            }
        }

        class Spark {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.03;
                this.size = 2 + Math.random() * 3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.life -= this.decay;
                return this.life > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class ShockwaveRing {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = 10;
                this.maxRadius = 80;
                this.alpha = 1.0;
            }

            update() {
                this.radius += 3.5;
                this.alpha = 1 - (this.radius / this.maxRadius);
                return this.alpha > 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function createSparkBurst(x, y, color) {
            for (let i = 0; i < 24; i++) {
                sparks.push(new Spark(x, y, color));
            }
        }

        function createRing(x, y, color) {
            rings.push(new ShockwaveRing(x, y, color));
        }

        function showCombatToast(x, y, text, color) {
            const toast = document.createElement('div');
            toast.className = 'toast-combat';
            toast.innerText = text;
            toast.style.left = `${x}px`;
            toast.style.top = `${y}px`;
            toast.style.color = color;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1200);
        }

        // -------------------------------------------------------------
        // ATTACK TRIGGER LOGIC
        // -------------------------------------------------------------
        function triggerAttackWave(type) {
            playSound('laser');
            const count = 5 + Math.floor(Math.random() * 4);
            const baseAngle = Math.random() * Math.PI * 2;
            for (let i = 0; i < count; i++) {
                const angle = baseAngle + (i - count / 2) * 0.15;
                const speed = 4 + Math.random() * 3.5;
                let label = "SQLi ' OR 1=1";
                if (type === 'XSS') label = "XSS <script>";
                if (type === 'RCE') label = "RCE ; whoami";
                packets.push(new Packet(type, label, angle, speed, true));
            }
        }

        function triggerDdosFlood() {
            playSound('laser');
            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 5 + Math.random() * 5;
                packets.push(new Packet('DDOS', 'DDoS Flood [RPS 800+]', angle, speed, true));
            }
        }

        function triggerCleanTraffic() {
            playSound('laser');
            for (let i = 0; i < 6; i++) {
                const angle = Math.PI * 0.8 + (Math.random() * 0.4);
                const speed = 3.5 + Math.random() * 2;
                packets.push(new Packet('CLEAN', 'HTTP 200 /search', angle, speed, false));
            }
        }

        function toggleOverdrive() {
            isOverdrive = !isOverdrive;
            targetShieldRadius = isOverdrive ? 180 : 130;
            playSound('shield');
            document.getElementById('tickerLog').innerText = isOverdrive 
                ? "⚡ سپر کوانتومی فعال شد: توان رهگیری و جذب ترافیک به ۲۰۰٪ افزایش یافت." 
                : "🛡️ سپر به حالت پایش نرمال بازگشت.";
        }

        // -------------------------------------------------------------
        // DRAWING CORE HOLOGRAPHIC SHIELD
        // -------------------------------------------------------------
        function drawShield(time) {
            shieldRotation += isOverdrive ? 0.025 : 0.008;
            shieldPulse = Math.sin(time * 0.003) * 6;
            shieldRadius += (targetShieldRadius - shieldRadius) * 0.08;

            const r = shieldRadius + shieldPulse;
            const b = BRANDS[currentBrand];

            ctx.save();
            ctx.translate(centerX, centerY);

            // 1. Outer Hexagonal Forcefield Grid
            ctx.save();
            ctx.rotate(shieldRotation);
            ctx.strokeStyle = isOverdrive ? '#ff0055' : b.primary;
            ctx.shadowBlur = isOverdrive ? 35 : 20;
            ctx.shadowColor = isOverdrive ? '#ff0055' : b.primary;
            ctx.lineWidth = 2.5;

            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (i * Math.PI / 3);
                const hx = Math.cos(a) * (r + 15);
                const hy = Math.sin(a) * (r + 15);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();

            // 2. Concentric Orbiting Rings with telemetry dashes
            ctx.save();
            ctx.rotate(-shieldRotation * 1.5);
            ctx.setLineDash([14, 18]);
            ctx.strokeStyle = b.accent;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(0, 0, r - 15, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            // 3. Central Core Glow (Radial Gradient)
            const radGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, r);
            radGrad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            radGrad.addColorStop(0.2, isOverdrive ? 'rgba(255, 0, 85, 0.8)' : 'rgba(0, 243, 255, 0.8)');
            radGrad.addColorStop(0.6, isOverdrive ? 'rgba(255, 0, 85, 0.2)' : 'rgba(59, 130, 246, 0.2)');
            radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = radGrad;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            // 4. Core Icon & Identity Text
            ctx.font = '36px Vazirmatn, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 20;
            ctx.shadowColor = b.primary;
            ctx.fillText(b.logo, 0, -8);

            ctx.font = '11px Orbitron, monospace';
            ctx.fillStyle = '#ffffff';
            ctx.letterSpacing = '2px';
            ctx.fillText("ACTIVE CORE", 0, 28);

            ctx.restore();
        }

        // -------------------------------------------------------------
        // BACKGROUND CYBER GRID
        // -------------------------------------------------------------
        function drawBackground(time) {
            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, width, height);

            // Subtle moving digital grid
            ctx.save();
            ctx.strokeStyle = 'rgba(15, 23, 42, 0.8)';
            ctx.lineWidth = 1;
            const gridSize = 60;
            const offsetX = (time * 0.015) % gridSize;
            const offsetY = (time * 0.015) % gridSize;

            for (let x = offsetX; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = offsetY; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
            ctx.restore();
        }

        // -------------------------------------------------------------
        // ANIMATION MAIN LOOP
        // -------------------------------------------------------------
        let lastTime = 0;
        let autoSpawnTimer = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            drawBackground(time);
            drawShield(time);

            // Update & Render Shockwaves
            for (let i = rings.length - 1; i >= 0; i--) {
                if (!rings[i].update()) rings.splice(i, 1);
                else rings[i].draw();
            }

            // Update & Render Sparks
            for (let i = sparks.length - 1; i >= 0; i--) {
                if (!sparks[i].update()) sparks.splice(i, 1);
                else sparks[i].draw();
            }

            // Update & Render Packets
            for (let i = packets.length - 1; i >= 0; i--) {
                if (!packets[i].update()) packets.splice(i, 1);
                else packets[i].draw();
            }

            // Ambient background packet generation (Simulated continuous real-time traffic)
            autoSpawnTimer += (time - lastTime);
            if (autoSpawnTimer > 900) {
                autoSpawnTimer = 0;
                if (Math.random() < 0.6) {
                    // Random light attack
                    const types = ['SQLI', 'XSS', 'RCE', 'BOT'];
                    const t = types[Math.floor(Math.random() * types.length)];
                    packets.push(new Packet(t, `${t} Probe`, Math.random() * Math.PI * 2, 3 + Math.random() * 2, true));
                } else {
                    // Random clean traffic
                    packets.push(new Packet('CLEAN', 'User GET /catalog', Math.PI * 0.7 + (Math.random() * 0.6), 3, false));
                }
            }

            lastTime = time;
        }

        // Start animation loop
        requestAnimationFrame(animate);

        // Initial burst on page load
        setTimeout(() => {
            triggerAttackWave('SQLI');
        }, 800);
    </script>
</body>
